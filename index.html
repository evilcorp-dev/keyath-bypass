<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEYAUTH</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --panel: #111;
    --border: #222;
    --accent: #00ff88;
    --accent-dim: rgba(0, 255, 136, 0.1);
    --text: #eee;
    --muted: #666;
    --err: #ff4444;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* --- TELA DE LOGIN --- */
  .login-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    text-align: center;
  }

  .login-card h1 {
    font-size: 24px;
    color: var(--accent);
    letter-spacing: 2px;
    margin-bottom: 4px;
    text-transform: uppercase;
  }

  .login-card p {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 32px;
  }

  label {
    display: block;
    text-align: left;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  input {
    width: 100%;
    background: #050505;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }

  input:focus { border-color: var(--accent); }

  button {
    width: 100%;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  button:hover {
    background: var(--accent-dim);
  }

  .error-msg {
    color: var(--err);
    font-size: 12px;
    margin-top: 16px;
    display: none;
  }

  /* --- DASHBOARD --- */
  .dash {
    width: 100%;
    max-width: 1000px;
    display: none;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
    margin-bottom: 24px;
  }

  .header h1 {
    font-size: 20px;
    color: var(--accent);
    letter-spacing: 1px;
  }

  .header span {
    color: var(--muted);
    font-size: 12px;
  }

  .header button {
    width: auto;
    padding: 8px 16px;
    border-color: var(--muted);
    color: var(--muted);
  }
  .header button:hover { border-color: var(--err); color: var(--err); background: transparent; }

  .gen-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 24px;
  }

  .gen-panel h2 {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 16px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .form-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .form-group {
    flex: 1;
    min-width: 200px;
  }

  .form-group input, .form-group select {
    margin-bottom: 0;
  }

  .form-group select {
    width: 100%;
    background: #050505;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    cursor: pointer;
  }

  .btn-gen {
    width: auto;
    padding: 12px 24px;
    align-self: flex-end;
  }

  .table-container {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th, td {
    padding: 14px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  th {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    background: #080808;
  }

  td { font-family: 'Consolas', monospace; }

  .badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
  }

  .badge.active { background: rgba(0,255,136,0.1); color: var(--accent); border: 1px solid var(--accent); }
  .badge.expired { background: rgba(255,68,68,0.1); color: var(--err); border: 1px solid var(--err); }
  .badge.paused { background: rgba(255,170,0,0.1); color: #ffaa00; border: 1px solid #ffaa00; }

  .btn-action {
    width: auto;
    padding: 6px 10px;
    font-size: 11px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    margin-right: 4px;
  }
  .btn-action:hover { border-color: var(--accent); color: var(--text); }
  .btn-action.del:hover { border-color: var(--err); color: var(--err); }
  
  .empty-msg {
    text-align: center;
    padding: 32px;
    color: var(--muted);
    font-style: italic;
  }
</style>
</head>
<body>

  <!-- LOGIN -->
  <div class="login-card" id="loginCard">
    <h1>KEYAUTH</h1>
    <p>painel administrativo</p>

    <label>Usuário</label>
    <input id="user" type="text" placeholder="digite o usuário" autocomplete="off">

    <label>Senha</label>
    <input id="pass" type="password" placeholder="digite a senha" autocomplete="off">

    <button id="loginBtn">Entrar</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <!-- DASHBOARD -->
  <div class="dash" id="dashCard">
    <div class="header">
      <div>
        <h1>KEYAUTH</h1>
        <span id="whoUser">logado como —</span>
      </div>
      <button id="logoutBtn">Sair</button>
    </div>

    <div class="gen-panel">
      <h2>Gerar Key</h2>
      <div class="form-row">
        <div class="form-group">
          <label>Discord User ID</label>
          <input id="uid" type="text" placeholder="ex: 1392646068868747305" maxlength="20">
        </div>
        <div class="form-group">
          <label>Plano / Validade</label>
          <select id="tier">
            <option value="1">1 Dia</option>
            <option value="7">7 Dias</option>
            <option value="30">30 Dias</option>
            <option value="life">Lifetime</option>
          </select>
        </div>
        <button class="btn-gen" id="genBtn">Gerar</button>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Key</th>
            <th>Plano</th>
            <th>Status</th>
            <th>Expira</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="5" class="empty-msg">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBWaYwkS4Aq8sDudHZR3Q2kqIgdFfzERP8",
  authDomain: "keygen-b6ee9.firebaseapp.com",
  databaseURL: "https://keygen-b6ee9-default-rtdb.firebaseio.com",
  projectId: "keygen-b6ee9",
  storageBucket: "keygen-b6ee9.firebasestorage.app",
  messagingSenderId: "743340504481",
  appId: "1:743340504481:web:bd3101131673d38ffe47e0"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const DAY = 24 * 60 * 60 * 1000;

// USUÁRIO E SENHA FIXOS (conforme pedido)
const FIXED_USER = "evilcorp";
const FIXED_PASS = "evilcorp123";

// Elementos
const $loginCard = document.getElementById('loginCard');
const $dashCard = document.getElementById('dashCard');
const $user = document.getElementById('user');
const $pass = document.getElementById('pass');
const $loginBtn = document.getElementById('loginBtn');
const $errorMsg = document.getElementById('errorMsg');
const $whoUser = document.getElementById('whoUser');
const $logoutBtn = document.getElementById('logoutBtn');
const $uid = document.getElementById('uid');
const $tier = document.getElementById('tier');
const $genBtn = document.getElementById('genBtn');
const $tableBody = document.getElementById('tableBody');

let keysCache = {};

// --- LÓGICA DE LOGIN FIXA ---
// Como tu quer que TODO MUNDO veja as keys, não vamos usar o Firebase Auth de verdade.
// Usamos um login local: se acertar a senha, o site "entra" na dashboard e puxa os dados do banco.
$loginBtn.addEventListener('click', () => {
  const u = $user.value.trim();
  const p = $pass.value;

  if (u === FIXED_USER && p === FIXED_PASS) {
    $loginCard.style.display = 'none';
    $dashCard.style.display = 'block';
    $whoUser.textContent = `logado como ${u}`;
    $errorMsg.style.display = 'none';

    // Autentica anonimamente no Firebase só pra ter permissão de leitura/escrita no DB
    auth.signInAnonymously().catch(err => {
      alert("Erro no Firebase. Ativou o login anônimo? Erro: " + err.message);
    });
  } else {
    $errorMsg.textContent = 'usuário ou senha incorretos';
    $errorMsg.style.display = 'block';
  }
});

$pass.addEventListener('keydown', e => { if (e.key === 'Enter') $loginBtn.click(); });

$logoutBtn.addEventListener('click', () => {
  auth.signOut();
  $dashCard.style.display = 'none';
  $loginCard.style.display = 'block';
  $user.value = '';
  $pass.value = '';
});

// --- CONEXÃO COM O BANCO (Realtime Database) ---
auth.onAuthStateChanged(user => {
  if (user) {
    const ref = db.ref('keys');
    ref.on('value', snap => {
      keysCache = snap.val() || {};
      renderTable();
    });
  }
});

function renderTable() {
  const entries = Object.values(keysCache);
  
  if (entries.length === 0) {
    $tableBody.innerHTML = '<tr><td colspan="5" class="empty-msg">Nenhuma key gerada ainda.</td></tr>';
    return;
  }

  // Ordena do mais recente pro mais antigo
  entries.sort((a, b) => b.issuedAt - a.issuedAt);

  let html = '';
  entries.forEach(k => {
    const isExpired = !k.paused && Date.now() > expiresAt(k);
    
    let statusHtml = '';
    if (k.paused) statusHtml = '<span class="badge paused">Pausada</span>';
    else if (isExpired) statusHtml = '<span class="badge expired">Expirada</span>';
    else statusHtml = '<span class="badge active">Ativa</span>';

    const expDate = k.tier === 'life' ? 'Nunca' : formatDate(expiresAt(k));
    
    // Botões de ação (Todo mundo que logar pode pausar/excluir, já que o login é geral)
    const actions = `
      ${k.paused 
        ? `<button class="btn-action" onclick="window.resumeKey('${k.id}')">Liberar</button>`
        : `<button class="btn-action" onclick="window.pauseKey('${k.id}')">Pausar</button>`
      }
      <button class="btn-action del" onclick="window.deleteKey('${k.id}')">Excluir</button>
    `;

    html += `
      <tr>
        <td>${k.key}</td>
        <td>${getTierName(k.tier)}</td>
        <td>${statusHtml}</td>
        <td>${expDate}</td>
        <td>${actions}</td>
      </tr>
    `;
  });

  $tableBody.innerHTML = html;
}

// --- GERAR KEY ---
$genBtn.addEventListener('click', async () => {
  const id = $uid.value.trim();
  if (!/^\d{17,20}$/.test(id)) {
    alert('ID do Discord inválido (deve ter 17 a 20 números).');
    return;
  }

  if (keysCache[id]) {
    alert('Já existe uma key para esse ID.');
    return;
  }

  const now = Date.now();
  const entry = {
    id: id,
    key: id,
    tier: $tier.value,
    issuedAt: now,
    paused: true, // Nasce pausada por padrão
    pausedAt: now
  };

  try {
    $genBtn.textContent = '...';
    await db.ref('keys/' + id).set(entry);
    $uid.value = '';
  } catch (err) {
    alert('Erro ao gerar: ' + err.message);
  } finally {
    $genBtn.textContent = 'Gerar';
  }
});

// --- AÇÕES NA TABELA (GLOBAIS) ---
window.pauseKey = async (id) => {
  await db.ref('keys/' + id).update({ paused: true, pausedAt: Date.now() });
};

window.resumeKey = async (id) => {
  const entry = keysCache[id];
  if (!entry) return;
  const pausedMs = Date.now() - (entry.pausedAt || entry.issuedAt);
  await db.ref('keys/' + id).update({
    paused: false,
    pausedAt: null,
    issuedAt: entry.issuedAt + pausedMs // Empurra o tempo de emissão pra frente
  });
};

window.deleteKey = async (id) => {
  if (confirm(`Excluir a key ${id}?`)) {
    await db.ref('keys/' + id).remove();
  }
};

// --- FUNÇÕES AUXILIARES ---
function expiresAt(e) {
  if (e.tier === 'life') return Infinity;
  const dur = parseInt(e.tier, 10) * DAY;
  if (e.paused) {
    const used = (e.pausedAt || e.issuedAt) - e.issuedAt;
    return (e.pausedAt || e.issuedAt) + (dur - used);
  }
  return e.issuedAt + dur;
}

function formatDate(ts) {
  if (ts === Infinity) return 'Nunca';
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function getTierName(tier) {
  const map = { '1': '1 Dia', '7': '7 Dias', '30': '30 Dias', 'life': 'Lifetime' };
  return map[tier] || tier;
}
</script>
</body>
</html>
